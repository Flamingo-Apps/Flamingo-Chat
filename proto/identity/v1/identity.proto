syntax = "proto3";

package identity.v1;

option go_package = "github.com/Flamingo-Apps/Flamingo-Chat/proto/gen/go/identity/v1;identityv1";

service IdentityService {
  rpc CreateAccount(CreateAccountRequest) returns (Account);
  rpc VerifyBadge(VerifyBadgeRequest) returns (Account);
  rpc GetAccount(GetAccountRequest) returns (Account);
  rpc UpdatePseudonym(UpdatePseudonymRequest) returns (Account);
}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

message Account {
  string id = 1;
  string pseudonym = 2;
  bool badge_verified = 3;
  Gender gender = 4;
  int64 created_at_unix = 5;
}

message CreateAccountRequest {
  string pseudonym = 1;
}

message VerifyBadgeRequest {
  string account_id = 1;
  string college_email = 2;
  Gender gender = 3;
}

message GetAccountRequest {
  string account_id = 1;
}

message UpdatePseudonymRequest {
  string account_id = 1;
  string new_pseudonym = 2;
}
