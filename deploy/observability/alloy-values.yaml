# Dev-only values for grafana/alloy (chart 1.14.0) - see DEC-0095.
#
# Ships as a DaemonSet (the chart default, kept as-is: one Alloy pod per
# node, tailing that node's pods). Reads pod logs through the
# Kubernetes API (loki.source.kubernetes) rather than mounting
# /var/log/pods via hostPath - no extra pod security/privilege needed,
# per Grafana's own current guidance for collecting Kubernetes logs.
#
# <LOKI_URL> below is filled in to point at the in-cluster Loki
# singleBinary service deploy/observability/loki-values.yaml installs
# (confirm the exact Service name with `kubectl get svc -l app.kubernetes.io/name=loki`
# after installing that release - it's set here to the expected default
# for a release named "loki").
alloy:
  # Under alloy:, not at the top level: the chart ignores a top-level
  # resources key, which left Alloy with no limit at all (INC-0017).
  # Measured peak 121Mi.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  configMap:
    content: |-
      loki.write "default" {
        endpoint {
          url = "http://loki.default.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

      discovery.kubernetes "pod" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }

        // Flamingo's own Deployment template labels every pod "app"
        // (deploy/helm/service/templates/deployment.yaml), not the
        // app.kubernetes.io/name convention this example otherwise uses.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          action        = "replace"
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "job"
          separator     = "/"
          replacement   = "$1"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "__path__"
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_id"]
          action        = "replace"
          target_label  = "container_runtime"
          regex         = `^(\S+):\/\/.+$`
          replacement   = "$1"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster = "flamingo-dev",
          }
        }

        forward_to = [loki.write.default.receiver]
      }
