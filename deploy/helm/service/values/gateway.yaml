name: gateway
image:
  repository: flamingo/gateway
protocol: http
port: 8080
env:
  HTTP_PORT: "8080"
  IDENTITY_ADDR: "identity:50051"
  CHAT_ADDR: "chat:50053"
  MATCHING_ADDR: "matching:50052"
  PRESENCE_ADDR: "presence:50054"
  MODERATION_ADDR: "moderation:50055"
  REDIS_URL: "redis://redis:6379/0"
  # Local development only (DEC-0014 says this comes from a Kubernetes
  # secret in a real deployment) - an obviously fake, never-used-outside-
  # this-cluster placeholder, the same pattern postgres-dev-credentials
  # already uses.
  SESSION_SIGNING_KEY: "local-dev-not-a-real-secret-do-not-use-in-production"
  # Empty disables Turnstile verification for guest signup
  # (docs/ARCHITECTURE.md §4.4) - there is no Turnstile secret for local
  # development.
  TURNSTILE_SECRET: ""
  # The client dev server's own origin - matches whatever `web/`'s Vite
  # dev server listens on once it exists (T11); same-origin requests
  # (the request's own Host header) are always allowed regardless of
  # this list.
  WS_ORIGIN_PATTERNS: "localhost:*"
  # DEC-0092's server-side Google redirect flow. COLLEGE_OAUTH_CLIENT_ID
  # matches identity's own value exactly (same registered OAuth client -
  # see that file's comment); GOOGLE_CLIENT_SECRET is irrelevant while
  # DEV_FAKE_GOOGLE is set, since the fake exchanger never calls Google.
  # GOOGLE_REDIRECT_URI and FRONTEND_URL match Tilt's own port-forwards
  # for gateway (8080) and web's dev server (8000).
  COLLEGE_OAUTH_CLIENT_ID: "155057367000-e6fvpmf6g3up2p20133i7jhnd0nc3hfn.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_REDIRECT_URI: "http://localhost:8080/v1/auth/google/callback"
  FRONTEND_URL: "http://localhost:8000"
  # Local development only (DEC-0049, mirrored as DEC-0092) - never set
  # this outside a local cluster.
  DEV_FAKE_GOOGLE: "1"
  # Rate limits (DEC-0108). Production uses the code's defaults; locally the
  # per-address signup limit stays tiny so the black-box test (BB-15) can
  # reach it in a few attempts.
  LIMIT_GUEST_SIGNUPS_PER_IP_PER_HOUR: "5"
