# Defaults shared by every service. Each values/<name>.yaml file under this
# chart overrides what differs - see docs/ARCHITECTURE.md §9.
name: ""
image:
  repository: ""
  tag: dev
  pullPolicy: IfNotPresent
# Names of registry Secrets the kubelet pulls the image with. None in dev,
# where the images are built locally; production pulls its private GHCR
# images with ghcr-pull (deploy/prod/create-secrets.sh, DEC-0101).
imagePullSecrets: []

# "grpc" services are checked with Kubernetes' native gRPC probe (stable
# since Kubernetes 1.27), which calls the standard grpc.health.v1.Health
# service every service already registers via pkg/grpclog's neighbour,
# health.NewServer(). "http" services are checked on /healthz instead.
# "worker" is for a service with no server of its own at all (a Kafka
# consumer such as delivery-worker or persistence-worker) - no Service
# object, no ports, no probe (DEC-0066); port is ignored for it.
protocol: grpc
port: 50051
# Every service, workers included, exposes Prometheus metrics on this
# port (pkg/metrics, DEC-0093) - declared here so it's always 9090
# without each values/<name>.yaml repeating it.
metricsPort: 9090

# Off by default - see templates/podmonitor.yaml for why. Set via
# --set/-f only where the PodMonitor CRD is actually installed.
podMonitor:
  enabled: false

replicas: 1

# Plain key: value environment variables.
env: {}

# Names of Secrets whose keys are all exposed as environment variables.
envFromSecret: []

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi
