apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- if ne .Values.protocol "worker" }}
            - name: {{ .Values.protocol }}
              containerPort: {{ .Values.port }}
            {{- end }}
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
          {{- if .Values.env }}
          env:
            {{- /* A null removes the variable (a production overlay deleting a dev-only setting). Helm itself only drops nulls against the chart's own defaults, not between values files, and an empty explicit env var would override the same name coming from envFromSecret. */}}
            {{- range $k, $v := .Values.env }}
            {{- if not (kindIs "invalid" $v) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.envFromSecret }}
          envFrom:
            {{- range .Values.envFromSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if eq .Values.protocol "grpc" }}
          readinessProbe:
            grpc:
              port: {{ .Values.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- else if eq .Values.protocol "http" }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          {{/*
            "worker" services (a Kafka consumer with no server of its own -
            delivery-worker, persistence-worker) get no probe at all: there
            is no port to check, and a crashed consumer process already
            exits non-zero, which the Deployment's restartPolicy handles
            without a probe's help (DEC-0066).
          */}}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
