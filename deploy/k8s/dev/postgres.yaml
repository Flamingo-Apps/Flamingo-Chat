# Local development only. One Postgres instance shared by every service,
# each reaching its own schema - see docs/ARCHITECTURE.md §2 and §6.
# Storage is emptyDir, not a PersistentVolumeClaim: this cluster is
# recreated from scratch regularly (`kind delete cluster`), so a PVC would
# not actually survive that either, and emptyDir needs no StorageClass to
# exist on the local cluster. The credentials match the connection string
# every service already falls back to when POSTGRES_URL is unset (see
# services/identity/main.go) - same placeholder docker-compose.yml used,
# obviously not real, and never used outside this local cluster.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-dev-credentials
type: Opaque
stringData:
  POSTGRES_USER: flamingo
  POSTGRES_PASSWORD: flamingo
  POSTGRES_DB: flamingo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-dev-credentials
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "flamingo", "-d", "flamingo"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "flamingo", "-d", "flamingo"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
