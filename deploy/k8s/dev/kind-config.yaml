# Config for the one-time `kind create cluster` that Tilt deploys into -
# see the "Local development" section of README.md. Not something Tilt
# reads itself; kind needs an existing cluster to already exist before
# `tilt up`/`tilt ci` can deploy anything into it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
