name: Images

# Builds every service's image on each merge to main and pushes it to
# GitHub Container Registry, tagged with the commit SHA (DEC-0099). It never
# deploys: production picks a tag explicitly with deploy/prod/deploy.sh <sha>.
# Building here rather than on a laptop also keeps release images off the
# local Docker Desktop that INC-0018 found unreliable.
#
# New packages on ghcr.io start out private; each one is made public once,
# by hand (package settings > Change visibility), so the cluster can pull
# them without a registry credential. They contain nothing but this public
# repository's code.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - identity
          - chat
          - matching
          - presence
          - moderation
          - delivery-worker
          - persistence-worker
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          # Repository root, as every Dockerfile expects (go.work needs every module).
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/flamingo-apps/flamingo-${{ matrix.service }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
