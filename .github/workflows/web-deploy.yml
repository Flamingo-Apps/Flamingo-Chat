name: Deploy web

# Deploys web/ to Vercel from here, not from Vercel's own GitHub integration
# (DEC-0107). It runs ONLY when someone starts it (Actions tab > Deploy web >
# Run workflow), like the backend's deploy.sh: the backend goes out first,
# then the web app, so the web never asks for something the backend does not
# have yet. It runs the same checks CI runs before it deploys. Nothing
# deploys on a merge or on a pull request.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
# VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID. And Vercel's own
# automatic deployments must be off for the project (web/vercel.json sets
# git.deploymentEnabled to false), or every merge would deploy twice.

on:
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same gate as CI, so a deploy never ships what a pull request
      # would have failed.
      - name: Check the web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Install the Vercel CLI
        run: npm install --global vercel@65.5.0

      # Temporary: status codes only, so this public log shows what the token
      # can reach without printing any id or secret.
      - name: Check what the token can reach
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/$1"; }
          case "$VERCEL_ORG_ID" in team_*) echo "org id is a team id" ;; *) echo "org id is NOT a team id (personal account id?)" ;; esac
          case "$VERCEL_PROJECT_ID" in prj_*) echo "project id looks like a project id" ;; *) echo "project id does NOT start with prj_" ;; esac
          echo "GET /v2/user                  -> $(code v2/user)"
          echo "GET /v2/teams                 -> $(code v2/teams)"
          echo "GET project, with teamId      -> $(code "v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")"
          echo "GET project, without teamId   -> $(code "v9/projects/$VERCEL_PROJECT_ID")"
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/teams | jq '{teams_visible_to_token: ((.teams // []) | length)}'

      # Run from the repository root: the project's Root Directory setting
      # (web) is applied by Vercel itself.
      - name: Pull the project's settings and environment variables
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Temporary: the first deploy failed with "Project not found" at the
      # deploy step although pull and build found the project. Prints only
      # key names, never the ids, since this log is public.
      - name: Show how the project is linked
        run: |
          ls -la .vercel || true
          jq '{keys: keys, settings: ((.settings // {}) | {rootDirectory, framework, buildCommand, outputDirectory})}' .vercel/project.json || true
          ls -la web/.vercel 2>&1 || true

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --debug --token=${{ secrets.VERCEL_TOKEN }}
