name: Bug report
description: Something is broken or behaves differently from what you expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems must not be reported here. Follow [SECURITY.md](https://github.com/Flamingo-Apps/Flamingo-Chat/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or commands that shows the problem.
      placeholder: |
        1. Start the identity service
        2. Call ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - gateway
        - identity
        - chat
        - matching
        - presence
        - moderation
        - persistence-worker
        - web frontend
        - deployment or CI
        - documentation
        - not sure
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove tokens, emails and anything else private before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This is not a security vulnerability.
          required: true
        - label: I searched existing issues and did not find this one.
          required: true
